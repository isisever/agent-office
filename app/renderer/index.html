<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:" />
    <title>Agent Office</title>
    <link rel="stylesheet" href="../node_modules/@xterm/xterm/css/xterm.css" />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <!-- Single frame: title bar on top, projects/accounts on the left, office in the middle, the active project's Claude Code terminal below.
         Theme colors wrap the whole frame via the --frame, --accent, --status-bg, --status-text CSS variables. -->
    <header id="titlebar">
      <button id="toggle-sidebar">≡</button>
      <span id="title">AGENT OFFICE</span>
      <span id="project"></span>
      <span id="warn" hidden></span>
      <button id="update" hidden></button>
      <span id="stats"></span>
    </header>
    <div id="body">
      <aside id="sidebar"></aside>
      <main id="app">
        <canvas id="office"></canvas>
        <!-- Agent details (agent-panel.js): the bot clicked in the office -->
        <aside id="agent-panel" hidden></aside>
        <div id="divider"></div>
        <div id="terminal">
          <!-- tabs (v3.0): strip only when the project has more than one terminal; with one terminal, "+" in the corner on hover -->
          <div id="tabs" hidden></div>
          <button id="tab-add" hidden>+</button>
          <div id="terminals"></div>
          <div id="empty" hidden>
            <!-- strings are set in app.js, in the selected language -->
            <p id="empty-title"></p>
            <button id="empty-add"></button>
            <p id="empty-note" class="dim"></p>
          </div>
        </div>
      </main>
    </div>
    <script type="module" src="./app.js"></script>
  </body>
</html>
