<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:" />
    <title>Agent Office</title>
    <link rel="stylesheet" href="../node_modules/@xterm/xterm/css/xterm.css" />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <!-- Tek çerçeve: üstte başlık, solda projeler/hesaplar, ortada ofis, altta etkin projenin Claude Code terminali.
         Tema renkleri --frame, --accent, --status-bg, --status-text CSS değişkenleriyle tüm çerçeveyi sarar. -->
    <header id="titlebar">
      <button id="toggle-sidebar">≡</button>
      <span id="title">AGENT OFFICE</span>
      <span id="project"></span>
      <span id="warn" hidden></span>
      <button id="update" hidden></button>
      <span id="stats"></span>
    </header>
    <div id="body">
      <aside id="sidebar"></aside>
      <main id="app">
        <canvas id="office"></canvas>
        <!-- Ajan ayrıntıları (agent-panel.js): ofiste tıklanan bot -->
        <aside id="agent-panel" hidden></aside>
        <div id="divider"></div>
        <div id="terminal">
          <!-- sekmeler (v3.0): şerit yalnız projede birden çok terminal varken; tek terminalde "+" köşede, üzerine gelince -->
          <div id="tabs" hidden></div>
          <button id="tab-add" hidden>+</button>
          <div id="terminals"></div>
          <div id="empty" hidden>
            <!-- metinler app.js'te, seçili dilde -->
            <p id="empty-title"></p>
            <button id="empty-add"></button>
            <p id="empty-note" class="dim"></p>
          </div>
        </div>
      </main>
    </div>
    <script type="module" src="./app.js"></script>
  </body>
</html>
