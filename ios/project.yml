name: AgentOfficeRemote
options:
  bundleIdPrefix: com.savasisisever.agentoffice
  deploymentTarget:
    iOS: "16.6"
include:
  - path: AgentOfficeRemote/addons/addons.yml
    relativePaths: true
packages:
  BareKit:
    url: https://github.com/holepunchto/bare-kit-swift
    exactVersion: 2.4.3
settings:
  base:
    DEVELOPMENT_TEAM: GLTH2M74NT
targets:
  AgentOfficeRemote:
    type: application
    platform: iOS
    deploymentTarget: "16.6"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.savasisisever.agentoffice.remote
        PRODUCT_NAME: AgentOfficeRemote
        INFOPLIST_KEY_CFBundleDisplayName: Agent Office Remote
        SWIFT_VERSION: 5.0
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "7"
    info:
      path: AgentOfficeRemote/Info.plist
      properties:
        CFBundleDisplayName: Agent Office Remote
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        NSCameraUsageDescription: Scans the pairing QR code shown in Agent Office on your Mac.
        NSMicrophoneUsageDescription: Lets you dictate messages by voice.
        NSSpeechRecognitionUsageDescription: Turns your speech into text for the message you are writing.
        CFBundleLocalizations: [en, tr]
        CFBundleDevelopmentRegion: en
        NSLocalNetworkUsageDescription: Finds your Agent Office desktop on the local network.
    entitlements:
      path: AgentOfficeRemote/AgentOfficeRemote.entitlements
      properties:
        com.apple.developer.kernel.extended-virtual-addressing: true
    dependencies:
      - package: BareKit
        product: BareKit
    sources:
      - path: AgentOfficeRemote
        excludes:
          - addons
          - app.bundle
      - path: AgentOfficeRemote/app.bundle
        type: file
        buildPhase: resources
        optional: true
    scheme:
      preActions:
        - name: Link and pack the worklet
          settingsTarget: AgentOfficeRemote
          script: |
            cd "${PROJECT_DIR}/core" && PATH="${PATH}:/opt/homebrew/bin:/usr/local/bin" npm run -s prebuild
