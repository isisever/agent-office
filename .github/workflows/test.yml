name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # the tests need no packages; the type-check only typescript and Node's types (found from app/ upwards)
      - name: Install the type-checker
        run: npm install --no-save --no-package-lock typescript@5.6.3 @types/node@22
      - name: Type-check the main process
        run: npx tsc -p app
      - name: Main process tests
        run: node --test app/test/main.test.cjs
      - name: Office renderer and session reading
        run: node app/test/office.test.mjs

  plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code
      - name: Validate the plugin
        run: claude plugin validate plugin
      - name: Plugin hook tests
        run: claude plugin test plugin
      - name: Terminal viewer smoke test
        run: node --test plugin/tests/viewer-smoke.mjs
