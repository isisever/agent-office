name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # eslint.config.mjs: ESLint's own recommended rules, no packages in the repo
      - name: Lint
        run: npx -y eslint@9 .
      # the app's own packages first: the type-check resolves electron, node-pty, electron-updater, xterm,
      # hyperswarm and hyperdht from app/node_modules, and the device link test needs hyperswarm (N-API
      # prebuilds inside the packages, nothing compiles). --ignore-scripts: no Electron download.
      # npm install, not npm ci: see linux-build
      - name: Install the app's packages
        working-directory: app
        run: npm install --ignore-scripts --no-audit --no-fund
      # only typescript and the types of Node are missing from the app's packages
      - name: Install the type-checker
        run: npm install --no-save --no-package-lock --ignore-scripts typescript@5.6.3 @types/node@22
      - name: Type-check the main process
        run: npx tsc -p app
      - name: Type-check the renderer
        run: npx tsc -p app/renderer
      - name: Main process tests
        run: node --test app/test/main.test.cjs
      - name: Locale files (same keys and placeholders, keys used in code exist)
        run: node --test app/test/locales.test.mjs
      - name: Engine capabilities
        run: node --test app/test/engine-caps.test.mjs
      - name: Bundled skill packs (contract v3.45)
        run: node --test app/test/skill-packs.test.mjs
      - name: One MCP system (contract v3.44)
        run: node --test app/test/mcp-servers.test.cjs
      - name: Office renderer and session reading
        run: node app/test/office.test.mjs
      - name: Office pictures (visual regression)
        run: node app/test/visual.test.mjs
      - name: Windows builder config (signing envs)
        run: node --test app/test/win-builder-config.test.cjs
      - name: Device link (two devices pair on a local DHT testnet)
        run: node --test app/test/link.test.cjs
      - name: HQ (board, consent, caps, remote rows, launch args)
        run: node --test app/test/hq.test.cjs app/test/hq-link.test.cjs
      - name: Routines (scheduler, held approvals)
        run: node --test app/test/routines.test.cjs
      - name: Effective model (what Auto runs on)
        run: node --test app/test/effective-model.test.cjs
      - name: node-pty quit-crash patch + pty guard
        run: node --test app/test/node-pty-patch.test.cjs
      - name: pty wiring (attachPty)
        run: node --test app/test/pty-attach.test.cjs

  plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code
      - name: Validate the plugin
        run: claude plugin validate plugin
      - name: Validate the bundled skill packs
        run: for d in skill-packs/*/; do claude plugin validate "$d" || exit 1; done
      - name: Plugin hook tests
        run: claude plugin test plugin
      - name: Terminal viewer smoke test
        run: node --test plugin/tests/viewer-smoke.mjs

  # Linux paketleri (AppImage ve .deb, x64). node-pty'nin Linux için hazır derlemesi yok: npm install onu
  # kaynaktan derler (python3, make, g++ ubuntu-latest'te var). npm ci değil: kilit dosyası macOS'ta üretildi,
  # Linux'a özgü isteğe bağlı paketleri içermiyor ("Missing: ... from lock file").
  linux-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install app dependencies (builds node-pty for Electron)
        working-directory: app
        run: npm install --no-audit --no-fund
      - name: Build AppImage and deb
        working-directory: app
        run: npm run dist:linux
      - name: Check the packages
        working-directory: app
        run: |
          ls -l release
          test -f release/latest-linux.yml
          # node-pty Linux için derlenmiş olmalı (yoksa uygulama terminal açamaz)
          dpkg-deb -c release/*.deb | grep -q 'node-pty/build/Release/pty.node'
      - uses: actions/upload-artifact@v4
        with:
          name: agent-office-linux
          path: |
            app/release/*.AppImage
            app/release/*.deb
            app/release/latest-linux.yml
          if-no-files-found: error

  # Windows installer (NSIS, x64; not code-signed). node-pty ships a win32-x64 prebuild (ConPTY), so nothing has to
  # compile. npm install, not npm ci: the lock file was made on macOS (see linux-build). Besides the build: the
  # Windows-only checks (status line through Git Bash and PowerShell, npm's claude.cmd through cmd.exe), the platform
  # tests of main.test.cjs, and node-pty running a command in a ConPTY inside the packaged app.
  windows-build:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Windows checks
        run: node --test app/test/windows.test.cjs
      - name: Platform decisions (main.test.cjs, Windows and terminal tests)
        run: node --test --test-name-pattern="^(Windows|terminal):" app/test/main.test.cjs
      - name: Install app dependencies
        working-directory: app
        run: npm install --no-audit --no-fund
      - name: Build the installer
        working-directory: app
        run: |
          node scripts/sync-core.mjs
          npx electron-builder --win --config scripts/win-builder-config.cjs --publish never
      - name: Check the installer
        working-directory: app
        run: |
          ls -l release
          test -f release/latest.yml
          ls release/AgentOffice-*-Setup.exe release/AgentOffice-*-Setup.exe.blockmap
          # node-pty for Windows must be in the package (prebuild or a local build), with ConPTY
          u="release/win-unpacked/resources/app.asar.unpacked/node_modules/node-pty"
          test -f "$u/prebuilds/win32-x64/conpty.node" || test -f "$u/build/Release/conpty.node"
          if ls "$u/prebuilds" 2>/dev/null | grep -q darwin; then echo "macOS node-pty prebuilds in the package"; exit 1; fi
      - name: node-pty in the packaged app (ConPTY)
        working-directory: app
        timeout-minutes: 2
        env:
          ELECTRON_RUN_AS_NODE: '1'
        run: '"release/win-unpacked/Agent Office.exe" test/pty-smoke.cjs "$(cygpath -w "$PWD/release/win-unpacked/resources/app.asar.unpacked/node_modules/node-pty")"'
      - uses: actions/upload-artifact@v4
        with:
          name: agent-office-windows
          path: |
            app/release/*-Setup.exe
            app/release/*-Setup.exe.blockmap
            app/release/latest.yml
          if-no-files-found: error
