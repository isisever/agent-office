name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # eslint.config.mjs: ESLint's own recommended rules, no packages in the repo
      - name: Lint
        run: npx -y eslint@9 .
      # the tests need no packages; the type-check needs typescript and the types of Node and the app's
      # modules (found from app/ upwards). --ignore-scripts: no Electron download, no native builds
      - name: Install the type-checker
        run: |
          npm install --no-save --no-package-lock --ignore-scripts typescript@5.6.3 @types/node@22 electron@44.7.0 node-pty@1.1.0 electron-updater@6.8.9 @xterm/xterm@6.0.0 @xterm/addon-fit@0.11.0
          # the renderer imports xterm from app/node_modules by relative path
          mkdir -p app/node_modules && cp -R node_modules/@xterm app/node_modules/
      - name: Type-check the main process
        run: npx tsc -p app
      - name: Type-check the renderer
        run: npx tsc -p app/renderer
      - name: Main process tests
        run: node --test app/test/main.test.cjs
      - name: Locale files (same keys and placeholders, keys used in code exist)
        run: node --test app/test/locales.test.mjs
      - name: Office renderer and session reading
        run: node app/test/office.test.mjs
      - name: Office pictures (visual regression)
        run: node app/test/visual.test.mjs

  plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code
      - name: Validate the plugin
        run: claude plugin validate plugin
      - name: Plugin hook tests
        run: claude plugin test plugin
      - name: Terminal viewer smoke test
        run: node --test plugin/tests/viewer-smoke.mjs

  # Linux paketleri (AppImage ve .deb, x64). node-pty'nin Linux için hazır derlemesi yok: npm install onu
  # kaynaktan derler (python3, make, g++ ubuntu-latest'te var). npm ci değil: kilit dosyası macOS'ta üretildi,
  # Linux'a özgü isteğe bağlı paketleri içermiyor ("Missing: ... from lock file").
  linux-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install app dependencies (builds node-pty for Electron)
        working-directory: app
        run: npm install --no-audit --no-fund
      - name: Build AppImage and deb
        working-directory: app
        run: npm run dist:linux
      - name: Check the packages
        working-directory: app
        run: |
          ls -l release
          test -f release/latest-linux.yml
          # node-pty Linux için derlenmiş olmalı (yoksa uygulama terminal açamaz)
          dpkg-deb -c release/*.deb | grep -q 'node-pty/build/Release/pty.node'
      - uses: actions/upload-artifact@v4
        with:
          name: agent-office-linux
          path: |
            app/release/*.AppImage
            app/release/*.deb
            app/release/latest-linux.yml
          if-no-files-found: error
